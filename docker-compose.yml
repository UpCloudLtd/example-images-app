services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: photos
      POSTGRES_PASSWORD: photos
      POSTGRES_DB: photos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photos"]
      interval: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://photos:photos@db:5432/photos
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: photos
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  db-data:
  storage-data:
