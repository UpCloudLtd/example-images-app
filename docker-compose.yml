services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: images
      POSTGRES_PASSWORD: images
      POSTGRES_DB: images
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U images -d images"]
      interval: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://images:images@db:5432/images
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: images
      GENERATOR_TOKEN: ${GENERATOR_TOKEN:-local-generator-token}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/generator')"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  generator:
    profiles: ["generator"]
    build:
      context: ./generator
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      BACKEND_URL: http://backend:5000
      GENERATOR_TOKEN: ${GENERATOR_TOKEN:-local-generator-token}
      IMAGE_DEVICE: ${IMAGE_DEVICE:-auto}
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model-cache:/models
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy

  # Runs the end-to-end tests against the frontend and backend services above.
  test:
    profiles: ["test"]
    build: ./test
    environment:
      BASE_URL: http://frontend
      CI: ${CI:-}
      WAIT_FOR_AI_MODEL: ${WAIT_FOR_AI_MODEL:-}
    volumes:
      - ./test/playwright-report:/app/playwright-report
      - ./test/test-results:/app/test-results
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
  model-cache:
